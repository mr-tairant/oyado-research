name: Verify editorial build
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          PUBLICATION_MODE: production
          SITE_URL: https://oyado-journal.pages.dev
      - run: node scripts/check-output.mjs dist production
      - run: node scripts/check-photos.mjs dist
      - run: npm audit --omit=dev --audit-level=high
