name: Verify editorial build
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          PUBLICATION_MODE: ${{ vars.PUBLICATION_MODE || 'demo' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://example.invalid' }}
